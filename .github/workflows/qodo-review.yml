name: Qodo Merge (PR Agent)
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request_target' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run pr agent on every pull request
    steps:
      - name: Check API key availability
        id: check_key
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No API key configured. The review step will be skipped."
          fi
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER__KEY || secrets.OPENAI_KEY }}
      - name: PR Agent action step
        if: steps.check_key.outputs.has_key == 'true'
        id: pragent
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER__KEY || secrets.OPENAI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER__KEY || secrets.OPENAI_KEY }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER__KEY || secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_BASE: "https://openrouter.ai/api/v1"
          OPENAI_MODEL: "openrouter/nvidia/nemotron-3.5-lightning:free"
          config.model: "openrouter/nvidia/nemotron-3.5-lightning:free"
          config.fallback_models: '["openrouter/google/gemma-4-26b-a4b-it:free", "openrouter/google/gemma-4-31b-it:free", "openrouter/nvidia/nemotron-3-super-120b-a12b:free", "openrouter/qwen/qwen3.8-27b:free"]'
          config.custom_model_max_tokens: "262144"
          config.max_output_tokens: "8192"
          config.enable_large_pr_handling: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
