name: 'UI Visual Regression'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'components/**'
      - 'app/**'
      - 'lib/**'

jobs:
  chromatic-vrt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required! Chromatic needs full git history for baselines
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Use your preferred pnpm version

      - name: Install Dependencies
        run: pnpm install

      - name: Run Chromatic Tests
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          onlyChanged: true
