[config]
model = "openrouter/nvidia/nemotron-3.5-lightning:free"
fallback_models = ["openrouter/google/gemma-4-26b-a4b-it:free", "openrouter/google/gemma-4-31b-it:free", "openrouter/nvidia/nemotron-3-super-120b-a12b:free", "openrouter/qwen/qwen3.8-27b:free"]
custom_model_max_tokens = 262144
max_output_tokens = 8192
enable_large_pr_handling = true
git_provider = "github"

[pr_reviewer]
extra_instructions = "Follow ASD-STE100 Plain Technical English. Maintain strict zero-radius architecture."

[pr_description]
extra_instructions = "Follow ASD-STE100 Plain Technical English."

[pr_code_suggestions]
extra_instructions = "Comply with strict zero-radius architecture (0px border radius, rounded-none)."
